name: Build Project Alice UWP (Xbox)

on:
  workflow_dispatch:
  push:

jobs:
  build-uwp:
    runs-on: windows-2022

    steps:
    - name: 1. Baixar o codigo e submodulos (dependencias)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 2. Configurar MSBuild e Visual Studio C++20
      uses: microsoft/setup-msbuild@v2

    - name: 3. Gerar projeto UWP via CMake (Unico)
      shell: cmd
      run: |
        mkdir build_uwp
        cd build_uwp
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_NAME="WindowsStore" -DCMAKE_SYSTEM_VERSION="10.0" -DCMAKE_CXX_STANDARD=20

    - name: 3.5. Configurar Geradores como Desktop (.exe) e Alice como UWP (.msix)
      shell: pwsh
      run: |
        Get-ChildItem -Path build_uwp -Filter *.vcxproj -Recurse | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          $content = $content -replace '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>'
          $content = $content -replace '<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>'

          # Transforma TODOS os 5 geradores em .exe Desktop normal (sem WindowsAppContainer)
          if ($_.Name -match 'ParserGenerator|DCONGENERATOR|DCONINTERFACEGEN|DataContainer') {
            Write-Host "Transformando gerador em Desktop .exe: $($_.Name)"
            $content = $content -replace '<AppContainerApplication>true</AppContainerApplication>', '<AppContainerApplication>false</AppContainerApplication>'
            $content = $content -replace '<WindowsAppContainer>true</WindowsAppContainer>', '<WindowsAppContainer>false</WindowsAppContainer>'
            $content = $content -replace '<ApplicationType>Windows Store</ApplicationType>', ''
            $content = $content -replace '<ApplicationTypeRevision>10.0</ApplicationTypeRevision>', ''
            $content = $content -replace '<WindowsTargetPlatformMinVersion>.*?</WindowsTargetPlatformMinVersion>', ''
            $content = $content -replace 'windowsapp\.lib;', 'kernel32.lib;user32.lib;'
          }

          Set-Content -Path $_.FullName -Value $content
        }

    - name: 4. Compilar os Geradores e depois o Alice UWP
      shell: pwsh
      run: |
        $root = (Get-Location).Path
        # 1. Compila os 5 geradores primeiro
        msbuild build_uwp/ParserGenerator/ParserGenerator.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        msbuild build_uwp/dependencies/DataContainerGenerator/DCONGENERATOR.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        msbuild build_uwp/FifInterfaceGenerator/DCONINTERFACEGEN.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        msbuild build_uwp/_deps/datacontainerlua-build/DataContainer-Lua.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        msbuild build_uwp/_deps/datacontaineroosreporter-build/DataContainer_OOS_Reporter/DataContainer_OOS_Reporter.vcxproj /p:Configuration=Release /p:Platform=x64 /m

        # 2. Adiciona as pastas onde os .exe nasceram ao PATH do Windows!
        $env:PATH = "$root\build_uwp\ParserGenerator\Release;" +
                    "$root\build_uwp\dependencies\DataContainerGenerator\Release;" +
                    "$root\build_uwp\FifInterfaceGenerator\Release;" +
                    "$root\build_uwp\_deps\datacontainerlua-build\Release;" +
                    "$root\build_uwp\_deps\datacontaineroosreporter-build\DataContainer_OOS_Reporter\Release;" +
                    $env:PATH

        # 3. Agora compila o Alice UWP (ele vai achar todos os geradores no PATH!)
        cmake --build build_uwp --config Release --target Alice -- /m
