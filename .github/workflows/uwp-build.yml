name: Project Alice UWP port diagnostics

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-probe:
    name: UWP platform probe (not the game)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify UWP build tooling
        shell: python
        run: |
          import os, shutil, subprocess, sys
          os.environ['CMAKE_EXE'] = shutil.which('cmake') or 'cmake'
          subprocess.run([sys.executable, 'tools/uwp/test_tooling.py'], check=True)
      - name: Compile AppContainer probe and package unsigned MSIX
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'tools/uwp/build_probe.py'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwp-platform-probe-unsigned
          path: |
            build_uwp_probe/AliceUwpProbe.msix
            build_uwp_probe/build.log
          if-no-files-found: error

  engine-compatibility:
    name: Strict UWP engine compile (port in progress)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Configure desktop host tools
        shell: cmd
        run: cmake -S . -B build_host -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF -DALICE_HOST_TOOLS_ONLY=ON
      - name: Build desktop generators
        shell: cmd
        run: cmake --build build_host --config Release --target ParserGenerator DCONGENERATOR DCONINTERFACEGEN DataContainer-Lua DataContainer_OOS_Reporter -- /m /bl:host-generators.binlog
      - name: Collect desktop executables
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'tools/uwp/collect_host_tools.py', 'build_host', 'host-tools'], check=True)
      - name: Configure strict UWP engine
        shell: cmd
        run: cmake -S . -B build_uwp -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 -DCMAKE_CXX_STANDARD=20 -DBUILD_TESTING=OFF -DALICE_HOST_TOOLS_DIR="%CD%/host-tools"
      - name: Select UWP dynamic runtime
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'tools/uwp/prepare.py', 'build_uwp'], check=True)
      - name: Compile with real UWP restrictions
        shell: cmd
        run: cmake --build build_uwp --config Release --target Alice -- /m /bl:uwp-engine.binlog /fl /flp:logfile=uwp-engine.log;verbosity=normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwp-build-diagnostics
          path: |
            *.binlog
            uwp-engine.log
            build_host/*.binlog
            build_uwp/*.binlog
            build_uwp/uwp-engine.log
            build_uwp/CMakeFiles/CMakeConfigureLog.yaml
            build_host/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
